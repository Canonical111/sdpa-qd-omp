name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: openmp, flags: "-O2 -funroll-all-loops -fopenmp", ld: "-fopenmp", gomp_min: 1}
          - {name: serial, flags: "-O2 -funroll-all-loops",          ld: "",         gomp_min: 0}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool libqd-dev
      - run: ./configure --with-qd-includedir=/usr/include --with-qd-libdir=/usr/lib/x86_64-linux-gnu
             CXXFLAGS="${{ matrix.flags }}" CFLAGS="${{ matrix.flags }}" LDFLAGS="${{ matrix.ld }}"
      - run: make -j"$(nproc)" || true
      - name: SPOOLES CC fix if the first make stopped there
        run: |
          if [ ! -x sdpa_qd ]; then
            f=$(find . -path '*spooles*' -name Make.inc | head -1)
            [ -n "$f" ] && sed -i 's|^# CC = gcc|  CC = gcc|' "$f"
            d=$(dirname "$f"); ( cd "$d" && find . -name '*.o' -delete && rm -f spooles.a && make global -f makefile ) || true
            find . -name libspooles.a -o -name spooles.a | head -2
          fi
      - run: make -j"$(nproc)"
      - name: OpenMP presence matches the matrix (static binary; use nm)
        run: |
          n=$(nm sdpa_qd | grep -c GOMP || true)
          [ "${{ matrix.gomp_min }}" -eq 1 ] && [ "$n" -ge 1 ] || { [ "${{ matrix.gomp_min }}" -eq 0 ] && [ "$n" -eq 0 ]; }
      - run: ./sdpa_qd -ds example1.dat-s -o out.result -p param.sdpa && grep objValPrimal out.result
      - name: accept long high-precision decimal tokens
        run: |
          awk 'NR <= 5 { print; next } { v=$5; if (v !~ /\./) v=v "."; for (i=0;i<600;i++) v=v "0"; print $1,$2,$3,$4,v }' example1.dat-s > long-decimal.dat-s
          ./sdpa_qd -ds long-decimal.dat-s -o long-decimal.result -p param.sdpa
          grep -q 'phase.value = pdOPT' long-decimal.result
          ! grep -qi nan long-decimal.result
      - name: fatal errors must exit non-zero
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # (a) nonexistent data file
          rc=$(run_rc ./sdpa_qd -ds no_such_file.dat-s -o /tmp/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing data file returned 0"
          # (b) unwritable output path
          rc=$(run_rc ./sdpa_qd -ds example1.dat-s -o /nonexistent_dir/x.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "unwritable output returned 0"
          # (c) missing parameter file
          rc=$(run_rc ./sdpa_qd -ds example1.dat-s -o /tmp/x.out -p no_such_param.sdpa)
          [ "$rc" -ne 0 ] || fail "missing parameter file returned 0"
          # (d) a successful solve must still be 0
          rc=$(run_rc ./sdpa_qd -ds example1.dat-s -o /tmp/ok.out -p param.sdpa)
          [ "$rc" -eq 0 ] || fail "successful solve returned $rc"
      - name: malformed input is rejected, never silently solved
        run: |
          set -u
          fail() { echo "FAIL: $1" >&2; exit 1; }
          run_rc() { set +e; "$@" >/dev/null 2>&1; echo $?; set -e; }
          # negative entry index: used to write out of bounds and print a full solution
          awk 'NR==5 {print "1 1 -3 -3 1.0"; next} {print}' example1.dat-s > neg-index.dat-s
          rc=$(run_rc ./sdpa_qd -ds neg-index.dat-s -o /tmp/neg.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "negative index accepted (rc=0)"
          grep -q objValPrimal /tmp/neg.out 2>/dev/null && fail "negative index produced a solution"
          # block index out of range
          awk 'NR==5 {print "1 99 1 1 1.0"; next} {print}' example1.dat-s > bad-block.dat-s
          rc=$(run_rc ./sdpa_qd -ds bad-block.dat-s -o /tmp/bb.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "out-of-range block index accepted (rc=0)"
          # comment-only file: used to loop forever writing output
          printf '*comment only\n' > cmt.dat-s
          set +e; timeout 20 ./sdpa_qd -ds cmt.dat-s -o /tmp/cmt.out -p param.sdpa >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" -ne 124 ] || fail "comment-only file still hangs (timed out)"
          [ "$rc" -ne 0 ] || fail "comment-only file returned 0"
          # truncated file
          head -3 example1.dat-s > trunc.dat-s
          rc=$(run_rc ./sdpa_qd -ds trunc.dat-s -o /tmp/tr.out -p param.sdpa)
          [ "$rc" -ne 0 ] || fail "truncated file returned 0"
      - name: 1-thread and 8-thread results are identical (determinism guarantee)
        if: matrix.openmp == 'yes'
        run: |
          OMP_NUM_THREADS=1 ./sdpa_qd -ds example1.dat-s -o t1.out -p param.sdpa >/dev/null
          OMP_NUM_THREADS=8 ./sdpa_qd -ds example1.dat-s -o t8.out -p param.sdpa >/dev/null
          # Select the solution-bearing lines rather than trying to exclude every
          # timing format -- the timer block has several shapes and an exclusion
          # filter silently rots. xVec/xMat/yMat are numeric-only lines.
          sel() { grep -E 'objValPrimal|objValDual|phase\.value|Iteration =|relative gap|feas\.error|^\{' "$1"; }
          diff <(sel t1.out) <(sel t8.out) || { echo "FAIL: 1 vs 8 threads differ" >&2; exit 1; }
          test -s <(sel t1.out) || { echo "FAIL: selector matched nothing" >&2; exit 1; }
